server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Tente de servir le fichier demandé, sinon renvoie index.html (géré par React Router)
        try_files $uri $uri/ /index.html;
    }

    # Optionnel : Cache agressif pour les assets statiques (optimise les performances)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
